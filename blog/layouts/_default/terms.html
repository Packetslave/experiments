{{ define "main" }}
<div class="intro">
  <h2>{{ .Title }}</h2>
</div>

{{ if .Data.Terms }}
<ul class="post-list">
  {{ range .Data.Terms.Alphabetical }}
  <li>
    <a href="{{ .Page.RelPermalink }}">
      <span class="post-title">{{ .Page.LinkTitle }}</span>
      <span class="post-date">{{ .Count }} post{{ if ne .Count 1 }}s{{ end }}</span>
    </a>
  </li>
  {{ end }}
</ul>
{{ else }}
<p>No tags yet.</p>
{{ end }}

<a class="back" href="{{ "" | relURL }}">&larr; All posts</a>
{{ end }}
