{{ define "main" }}
<div class="intro">
  <h2>{{ .Title }}</h2>
</div>

{{ if .Pages }}
<ul class="post-list">
  {{ range .Pages.ByDate.Reverse }}
  <li>
    <a href="{{ .RelPermalink }}">
      <span class="post-date">{{ .Date.Format "Jan 2" }}</span>
      <span class="post-title">{{ .Title }}</span>
    </a>
  </li>
  {{ end }}
</ul>
{{ else }}
<p>Nothing here yet.</p>
{{ end }}

<a class="back" href="{{ "" | relURL }}">&larr; All posts</a>
{{ end }}
