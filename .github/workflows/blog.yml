name: Deploy blog

on:
  push:
    branches: [main]
    paths:
      - "blog/**"
      - ".github/workflows/blog.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-blog
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.148.2"
          extended: true

      - name: Build
        run: hugo --minify --source blog

      # destination_dir scopes the deploy to gh-pages/blog/ so the
      # static tools at the gh-pages root are left untouched.
      - name: Deploy to gh-pages/blog
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: blog/public
          destination_dir: blog
          commit_message: "Deploy blog: ${{ github.event.head_commit.message || 'manual run' }}"
