name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "blog/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.148.2"
          extended: true

      - name: Assemble site
        run: |
          mkdir -p site
          cp -r docs/. site/
          hugo --minify --source blog --destination "$GITHUB_WORKSPACE/site/blog"

      # Publishes the assembled tree as the entire gh-pages branch, so
      # gh-pages always mirrors main. Files on gh-pages that are not
      # produced by this job are removed on the next deploy.
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site
          commit_message: "Deploy site: ${{ github.event.head_commit.message || 'manual run' }}"

  # Deploys the blog to the personal server over Tailscale + rsync with a
  # forced-command (rrsync) deploy key. Disabled until the repository
  # variable SERVER_DEPLOY is set to 'true'; full setup, including the
  # server side and the tailnet ACLs, is documented in blog/DEPLOY.md.
  deploy-server:
    runs-on: ubuntu-latest
    if: vars.SERVER_DEPLOY == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.148.2"
          extended: true

      # The server gets its own build so links point at the real domain
      # (BLOG_BASE_URL) instead of the GitHub Pages URL.
      - name: Build with production base URL
        run: hugo --minify --source blog --baseURL "${{ vars.BLOG_BASE_URL }}"

      - name: Join tailnet as ephemeral node
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # The runner reaches the server over the tailnet, whose WireGuard
      # layer already authenticates the peer node — so learning the SSH
      # host key with ssh-keyscan at deploy time is safe, and there is
      # no pinned known-hosts variable to maintain or let go stale.
      - name: Configure SSH
        env:
          HOST: ${{ vars.DEPLOY_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.BLOG_DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 15 "$HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts || { echo "ssh-keyscan got no host key from $HOST"; exit 1; }

      # The target path is "/" because the key's forced rrsync command
      # jails the session to the blog directory on the server.
      - name: Rsync to server
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes" \
            blog/public/ "${{ vars.DEPLOY_SSH_USER }}@${{ vars.DEPLOY_SSH_HOST }}:/"
